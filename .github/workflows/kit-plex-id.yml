# Kit Labs OS 1.6.2 (identifiant plex) : à lancer UNE fois (Actions -> Kit 1.6.2 identifiant plex -> Run workflow).
# Après usage : supprimer ce fichier (Projet Labs : delete_doc) ; le script se supprime tout seul.
name: Kit 1.6.2 identifiant plex
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch du kit
        run: python3 scripts/kit_plex_id.py
      - name: Commiter et pousser
        run: |
          git config user.name "Aurélien Coiffard"
          git config user.email "aurelien.coiffard@gmail.com"
          git rm -q -f scripts/kit_plex_id.py
          git add -A
          git commit -m "chore(kit): Labs OS 1.6.2, plex identifier for Plex Labs"
          git push
