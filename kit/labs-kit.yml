# Labs OS — modèle du workflow de propagation, à copier dans .gitea/workflows/labs-kit.yml de chaque appli.
# Remplacer KIT_DIR (dossier servi par l'appli, ex. app/static/labs-os) et IMAGE_WORKFLOW (fichier du workflow d'image).
# Les applis sont sur Gitea (Gitea Actions) ; labs-brand reste public sur GitHub, le kit y est lu.
# Déclenché par Projet Labs (bouton « Propager à la suite » : workflow_dispatch par l'API Gitea, entrée ref),
# à la main (Actions → Kit Labs OS → Exécuter) ou chaque lundi (filet de sécurité).
# Gitea Actions n'a pas de repository_dispatch : c'est pourquoi la propagation passe par workflow_dispatch.
name: Kit Labs OS
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou version de labs-brand à recopier"
        required: false
        default: "main"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
  actions: write
concurrency:
  group: labs-kit
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recopier le kit depuis labs-brand
        id: sync
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
        # Le résultat passe par une variable : un échec du script (ref inexistante, réseau)
        # fait alors échouer l'étape, au lieu d'être masqué par « echo ».
        run: |
          set -eu
          result="$(sh scripts/sync-labs-kit.sh KIT_DIR "$REF")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Commiter et reconstruire l'image
        if: startsWith(steps.sync.outputs.result, 'changed')
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "Aurélien Coiffard"
          git config user.email "30692648+brainwasher-01@users.noreply.github.com"
          git add KIT_DIR
          git commit -m "chore(ui): sync Labs OS kit $(cat KIT_DIR/VERSION)"
          git push
          # Un push fait avec le jeton du workflow ne relance pas les autres workflows :
          # on lance le workflow d'image explicitement, par l'API Gitea.
          curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/IMAGE_WORKFLOW/dispatches"
